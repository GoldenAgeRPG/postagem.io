<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Dossier + Calc Master</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@300;400;600&family=Yuji+Syuku&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <style>
    /* --- CSS DA INTERFACE DO EDITOR (THEME JJK 8BIT) --- */
    :root {
      --bit-bg: #0e0b14; --bit-panel: #1a1625; --bit-purple: #9b00ff;
      --bit-cyan: #00e5ff; --bit-green: #00ff8c; --bit-border: #4a3b5e; --bit-text: #d8d8d8;
    }
    
    html, body { height: 100%; margin: 0; padding: 0; font-family: 'VT323', monospace; background-color: var(--bit-bg); color: var(--bit-text); font-size: 18px; }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--bit-panel); border-left: 2px solid var(--bit-border); }
    ::-webkit-scrollbar-thumb { background: var(--bit-border); border: 2px solid var(--bit-panel); }
    ::-webkit-scrollbar-thumb:hover { background: var(--bit-purple); }

    .layout-grid { display: grid; grid-template-columns: 500px 1fr; height: 100%; width: 100%; }
    
    .editor-pane { background: var(--bit-panel); border-right: 4px solid var(--bit-purple); display: flex; flex-direction: column; height: 100%; min-height: 0; z-index: 10; box-shadow: 10px 0 20px rgba(0,0,0,0.8); overflow-y: auto;}
    .editor-header { padding: 20px; background: #110d1a; border-bottom: 4px solid var(--bit-purple); flex-shrink: 0; position: sticky; top: 0; z-index: 20; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .editor-header h1 { margin: 0; font-family: 'Press Start 2P', cursive; color: var(--bit-cyan); font-size: 1.2em; text-shadow: 3px 3px 0px #000; line-height: 1.5; }
    
    .tabs { display: flex; gap: 10px; margin-top: 15px; border-bottom: 2px solid var(--bit-border); padding-bottom: 10px; }
    .tab-btn { background: transparent; border: none; color: var(--bit-text); font-family: 'Press Start 2P', cursive; font-size: 0.6em; cursor: pointer; padding: 10px; opacity: 0.5; transition: 0.2s; text-transform: uppercase; }
    .tab-btn:hover { opacity: 0.8; color: #fff; }
    .tab-btn.active { opacity: 1; color: var(--bit-cyan); border-bottom: 2px solid var(--bit-cyan); }
    
    .editor-scroll-area { flex: 1 1 auto; padding: 20px; }
    .editor-content-wrapper { display: flex; flex-direction: column; gap: 20px; padding-bottom: 50px; }

    .field-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 4px; }
    .field-header label { margin-bottom: 0; }

    label { font-size: 1.1em; color: var(--bit-purple); text-transform: uppercase; margin-bottom: 4px; display: block; text-shadow: 1px 1px 0 #000; }
    input[type="text"], input[type="number"], textarea, select { background: #050408; border: 2px solid var(--bit-border); color: #fff; padding: 10px; font-family: 'VT323', monospace; font-size: 1.2em; width: 100%; box-sizing: border-box; box-shadow: inset 3px 3px 0px rgba(0,0,0,0.5); transition: border-color 0.2s, box-shadow 0.2s; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--bit-cyan); background: #090810; box-shadow: 0 0 10px rgba(0, 229, 255, 0.4), inset 3px 3px 0px rgba(0,0,0,0.5); }
    textarea { resize: vertical; line-height: 1.3; }
    
    .row { display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;}
    .col { flex: 1; min-width: 60px; }

    .checkbox-wrap { display: flex; align-items: center; gap: 10px; font-size: 1.1em; color: var(--bit-text); cursor: pointer; transition: color 0.2s; }
    .checkbox-wrap:hover { color: #fff; }
    .checkbox-wrap input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--bit-purple); }

    .bbcode-toolbar { display: flex; gap: 5px; background: #252033; padding: 8px; border: 2px solid var(--bit-border); border-bottom: none; flex-wrap: wrap; align-items: center; }
    .bb-btn { background: #4a3b5e; border: 2px solid #000; color: #fff; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: 'Press Start 2P', cursive; font-size: 0.6em; box-shadow: 2px 2px 0px #000; transition: transform 0.1s, background 0.2s; }
    .bb-btn:hover { background: var(--bit-purple); transform: translate(-1px, -1px); box-shadow: 3px 3px 0px #000; }
    .bb-btn:active { transform: translate(2px, 2px); box-shadow: none; }
    .color-wrapper { position: relative; width: 32px; height: 32px; display: inline-block; }
    .color-wrapper input[type="color"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .color-indicator { width: 32px; height: 32px; border: 2px solid #000; box-shadow: 2px 2px 0px #000; }

    .mini-toolbar { display: flex; gap: 4px; }
    .mini-btn { background: #4a3b5e; border: 1px solid #000; color: #fff; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: 'Press Start 2P', cursive; font-size: 0.5em; box-shadow: 1px 1px 0px #000; transition: 0.1s; }
    .mini-btn:hover { background: var(--bit-purple); color: #fff; }

    .btn { padding: 15px; border: 2px solid #000; font-family: 'Press Start 2P', cursive; font-size: 0.8em; cursor: pointer; width: 100%; text-transform: uppercase; text-align: center; box-shadow: 4px 4px 0px rgba(0,0,0,0.5); transition: 0.1s; }
    .btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0px rgba(0,0,0,0.5); filter: brightness(1.2); }
    .btn:active { transform: translate(4px, 4px); box-shadow: none; }
    .btn-primary { background: var(--bit-purple); color: #fff; }
    .btn-secondary { background: #333; color: #ccc; }
    .btn-success { background: var(--bit-green); color: #000; }

    .dynamic-item { background: rgba(0,0,0,0.4); border: 2px solid var(--bit-border); padding: 15px; margin-bottom: 15px; position: relative; transition: border-color 0.2s; }
    .dynamic-item:hover { border-color: var(--bit-purple); }
    .btn-del { position: absolute; top: 5px; right: 5px; background: transparent; border: none; color: #ff3366; cursor: pointer; font-size: 18px; font-weight: bold; transition: transform 0.2s; }
    .btn-del:hover { transform: scale(1.2); }
    
    .calc-box { background: rgba(0,0,0,0.4); border: 2px dashed var(--bit-border); padding: 15px; margin-bottom: 20px; transition: border-color 0.2s; }
    .calc-box:hover { border-color: var(--bit-cyan); }
    .calc-result { font-family: 'Press Start 2P'; color: var(--bit-cyan); font-size: 1.2em; text-align: center; margin: 20px 0; text-shadow: 0 0 10px rgba(0, 229, 255, 0.4); }

    .nested-grid { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; background: rgba(255,255,255,0.02); padding: 10px; border: 2px dashed var(--bit-border); border-radius: 4px;}
    .nested-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;}
    .nested-row > .col { min-width: 85px; }
    .nested-row input { font-size: 1em; padding: 8px; box-shadow: inset 3px 3px 0px rgba(0,0,0,0.5); min-width: 85px;}
    .nested-row select { font-family: 'VT323', monospace; font-size: 0.9em; padding: 8px 4px; background: #050408; border: 2px solid var(--bit-border); color: #fff; cursor: pointer; min-width: 100px; flex: 1; box-shadow: inset 3px 3px 0px rgba(0,0,0,0.5);}
    .nested-row select:focus { border-color: var(--bit-purple); }
    
    .btn-add-line { background: rgba(155, 0, 255, 0.1); border: 2px dashed var(--bit-purple); color: var(--bit-cyan); width: 100%; padding: 8px; cursor: pointer; font-family: 'Press Start 2P', cursive; font-size: 0.6em; margin-top: 6px; transition: 0.2s;}
    .btn-add-line:hover { background: rgba(155, 0, 255, 0.3); color: #fff; }
    .del-line { background: transparent; border: none; color: #ff3366; cursor: pointer; font-size: 1.2em; font-weight: bold; padding: 0 10px; transition: 0.1s;}
    .del-line:hover { transform: scale(1.2); }

    .smart-read-box { background: rgba(155, 0, 255, 0.05); border: 2px dashed var(--bit-purple); padding: 15px; margin-bottom: 20px; }
    .smart-read-box textarea { height: 75px; font-size: 1.1em; margin-bottom: 10px; border-color: var(--bit-purple); color: #fff; background: #050408; padding: 10px; width: 100%; box-sizing: border-box; }

    .preview-pane { background: #050505; background-image: linear-gradient(rgba(30, 30, 30, 0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(30, 30, 30, 0.5) 1px, transparent 1px); background-size: 40px 40px; overflow-y: auto; height: 100%; display: flex; justify-content: center; padding: 40px; box-sizing: border-box; }
    #preview-box { width: 100%; max-width: 750px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
    .modal-box { background: var(--bit-panel); padding: 20px; border: 4px solid var(--bit-purple); width: 90%; max-width: 500px; box-shadow: 10px 10px 0px #000; text-align: center; }
    .editor-tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .editor-tools .btn { font-size: 0.56em; padding: 11px 8px; }
    .quick-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .quick-stat { background: rgba(0,0,0,0.35); border: 2px solid var(--bit-border); padding: 10px; box-shadow: inset 2px 2px 0 rgba(0,0,0,0.45); }
    .quick-stat span { display: block; color: var(--bit-cyan); font-family: 'Press Start 2P', cursive; font-size: 0.48em; margin-bottom: 8px; }
    .quick-stat b { color: #fff; font-family: 'VT323', monospace; font-size: 1.55em; font-weight: normal; }
    .preview-toolbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; max-width: 750px; margin-bottom: 16px; padding: 10px; background: rgba(10,8,16,0.92); border: 2px solid var(--bit-border); box-shadow: 5px 5px 0 rgba(0,0,0,0.45); backdrop-filter: blur(4px); }
    .preview-toolbar label { margin: 0; font-size: 0.9em; color: var(--bit-cyan); }
    .preview-toolbar input[type="range"] { width: 150px; accent-color: var(--bit-cyan); }
    .preview-shell { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .toast { position: fixed; right: 18px; bottom: 18px; z-index: 300; background: #050408; color: var(--bit-green); border: 3px solid var(--bit-green); box-shadow: 5px 5px 0 #000; padding: 14px 16px; font-family: 'Press Start 2P', cursive; font-size: 0.62em; line-height: 1.5; max-width: min(360px, calc(100vw - 36px)); }

    @media (max-width: 1000px) {
      html, body { height: auto; min-height: 100%; }
      .layout-grid { grid-template-columns: 1fr; height: auto; }
      .editor-pane { height: auto; min-height: 70vh; border-right: none; border-bottom: 4px solid var(--bit-purple); }
      .editor-header h1 { font-size: 0.95em; }
      .tabs { overflow-x: auto; }
      .preview-pane { min-height: 70vh; padding: 24px 14px; }
    }

    @media (max-width: 560px) {
      .editor-scroll-area { padding: 14px; }
      .editor-tools, .quick-stats { grid-template-columns: 1fr; }
      .preview-toolbar { flex-direction: column; align-items: stretch; }
      .preview-toolbar input[type="range"] { width: 100%; }
    }
  </style>
</head>
<body>

<div id="app">
  <div class="toast" v-if="toast">{{ toast }}</div>

  <div class="modal-overlay" v-if="showImportModal">
    <div class="modal-box">
      <h3 style="margin-top:0; color:var(--bit-cyan); font-family:'Press Start 2P'; font-size:0.8em; line-height:1.5;">IMPORTAR DADOS</h3>
      <textarea v-model="importCode" style="height:150px; margin-bottom:10px;" placeholder="Cole o HTML da postagem aqui..."></textarea>
      <div class="row">
        <button class="btn btn-primary" @click="processImport">CARREGAR</button>
        <button class="btn btn-secondary" @click="showImportModal = false">CANCELAR</button>
      </div>
    </div>
  </div>

  <div class="layout-grid">
    <div class="editor-pane">
      <div class="editor-header">
        <h1>POST EDITOR</h1>
        <div class="tabs">
          <button class="tab-btn" :class="{active: activeTab === 'editor'}" @click="activeTab = 'editor'">EDITOR RP</button>
          <button class="tab-btn" :class="{active: activeTab === 'status'}" @click="activeTab = 'status'">DOSSIÊ</button>
          <button class="tab-btn" :class="{active: activeTab === 'calc'}" @click="activeTab = 'calc'">CALCULADORA</button>
        </div>
      </div>
      
      <div class="editor-scroll-area">
        
        <div class="editor-content-wrapper" v-show="activeTab === 'editor'">
          <div class="editor-tools">
            <button class="btn btn-secondary" @click="showImportModal = true">IMPORTAR HTML</button>
            <button class="btn btn-secondary" @click="resetData">LIMPAR TUDO</button>
            <button class="btn btn-secondary" @click="downloadCode">BAIXAR HTML</button>
            <button class="btn btn-secondary" @click="copyPlainText">COPIAR TEXTO</button>
          </div>

          <div class="quick-stats">
            <div class="quick-stat"><span>PALAVRAS</span><b>{{ liveWordCount }}</b></div>
            <div class="quick-stat"><span>ITENS</span><b>{{ d.inventory.length }}</b></div>
            <div class="quick-stat"><span>TÉCNICAS</span><b>{{ d.techniques.length }}</b></div>
          </div>

          <div>
            <label>IMAGEM DE TOPO (URL)</label>
            <input type="text" v-model="d.img" placeholder="https://...">
          </div>

          <div class="row">
            <div class="col"><label>TÍTULO</label><input type="text" v-model="d.title" placeholder="Título da Postagem"></div>
            <div class="col"><label>SUBTÍTULO</label><input type="text" v-model="d.subtitle" placeholder="Local / Data / Turno"></div>
          </div>

          <div class="row">
            <div class="col"><label style="color:#FF50A0;">HP</label><input type="text" v-model="d.hp" placeholder="100/100"></div>
            <div class="col"><label style="color:#a050ff;">EA</label><input type="text" v-model="d.ea" placeholder="100/100"></div>
            <div class="col"><label style="color:#50c8ff;">SAN</label><input type="text" v-model="d.san" placeholder="100/100"></div>
          </div>

          <div>
            <div class="field-header">
              <label>NARRAÇÃO (RP)</label>
            </div>
            <div class="bbcode-toolbar">
              <button class="bb-btn" @click="insertTag('inp-body', '[b]', '[/b]', d, 'body')">B</button>
              <button class="bb-btn" @click="insertTag('inp-body', '[i]', '[/i]', d, 'body')">I</button>
              <button class="bb-btn" @click="insertTag('inp-body', '[u]', '[/u]', d, 'body')">U</button>
              <button class="bb-btn" @click="insertTag('inp-body', '[s]', '[/s]', d, 'body')">S</button>
              <button class="bb-btn" @click="insertTag('inp-body', '[quote]', '[/quote]', d, 'body')"><span class="material-icons-round" style="font-size:16px;">format_quote</span></button>
              <div class="color-wrapper">
                 <div class="color-indicator" :style="{ backgroundColor: colorPick }"></div>
                 <input type="color" v-model="colorPick">
              </div>
              <button class="bb-btn" style="background:var(--bit-cyan); color:#000;" @click="insertTag('inp-body', `[color=${colorPick}]`, '[/color]', d, 'body')"><span class="material-icons-round" style="font-size:16px;">brush</span></button>
            </div>
            <textarea id="inp-body" v-model="d.body" style="height:350px; border-top: none;"></textarea>
          </div>

          <button class="btn btn-success" @click="copyCode">COPIAR CÓDIGO FINAL</button>
        </div>

        <div class="editor-content-wrapper" v-show="activeTab === 'status'">
          <div class="row">
            <div class="col"><label>Objetivo</label><input type="text" v-model="d.obj"></div>
            <div class="col"><label>Palavras</label><input type="text" v-model="d.words"></div>
          </div>
          <div class="row">
            <div class="col" style="flex:0.5"><label>Turno</label><input type="text" v-model="d.turn"></div>
            <div class="col">
              <label>Vigor</label>
              <select v-model="d.lifestyle">
                <option value="Inanição">Inanição</option><option value="Subnutrido">Subnutrido</option>
                <option value="Estável">Estável</option><option value="Saciado">Saciado</option>
                <option value="Vigoroso">Vigoroso</option><option value="Pleno">Pleno</option>
              </select>
            </div>
            <div class="col">
              <label>Link do Vigor</label>
              <input type="text" v-model="d.lifestyle_link" placeholder="URL da Ficha/Vigor">
            </div>
          </div>

          <div>
            <label style="margin-top:10px;">AÇÕES ALOCADAS</label>
            <div class="row">
              <div class="col"><label style="font-size:0.8em; color:#888;">ATK</label><input type="text" v-model="d.act_off"></div>
              <div class="col"><label style="font-size:0.8em; color:#888;">DEF</label><input type="text" v-model="d.act_def"></div>
              <div class="col"><label style="font-size:0.8em; color:#888;">SUP</label><input type="text" v-model="d.act_sup"></div>
              <div class="col"><label style="font-size:0.8em; color:#888;">LIV</label><input type="text" v-model="d.act_free"></div>
            </div>
          </div>

          <div>
            <div class="field-header">
              <label>CONSIDERAÇÕES</label>
              <div class="mini-toolbar">
                <button class="mini-btn" @click="insertTag('inp-notes', '[b]', '[/b]', d, 'notes')">B</button>
                <button class="mini-btn" @click="insertTag('inp-notes', '[i]', '[/i]', d, 'notes')">I</button>
              </div>
            </div>
            <textarea id="inp-notes" v-model="d.notes" style="height:80px;"></textarea>
          </div>

          <div>
            <div class="field-header">
              <label>RESUMO</label>
              <div class="mini-toolbar">
                <button class="mini-btn" @click="insertTag('inp-summary', '[b]', '[/b]', d, 'summary')">B</button>
                <button class="mini-btn" @click="insertTag('inp-summary', '[i]', '[/i]', d, 'summary')">I</button>
              </div>
            </div>
            <textarea id="inp-summary" v-model="d.summary" style="height:80px;"></textarea>
          </div>
          
          <div>
            <div class="field-header">
              <label>EFEITOS</label>
              <div class="mini-toolbar">
                <button class="mini-btn" @click="insertTag('inp-effects', '[b]', '[/b]', d, 'effects')">B</button>
                <button class="mini-btn" @click="insertTag('inp-effects', '[i]', '[/i]', d, 'effects')">I</button>
              </div>
            </div>
            <textarea id="inp-effects" v-model="d.effects" style="height:80px;"></textarea>
          </div>

          <div>
            <div class="field-header">
              <label>APTIDÕES USADAS</label>
              <div class="mini-toolbar">
                <button class="mini-btn" @click="insertTag('inp-aptitudes', '[b]', '[/b]', d, 'aptitudes')">B</button>
                <button class="mini-btn" @click="insertTag('inp-aptitudes', '[i]', '[/i]', d, 'aptitudes')">I</button>
              </div>
            </div>
            <textarea id="inp-aptitudes" v-model="d.aptitudes" style="height:80px;"></textarea>
          </div>
          
          <div>
            <div class="field-header">
              <label>CÁLCULOS (INJETADOS)</label>
              <div class="mini-toolbar">
                <button class="mini-btn" @click="insertTag('inp-calculations', '[b]', '[/b]', d, 'calculations')">B</button>
                <button class="mini-btn" @click="insertTag('inp-calculations', '[i]', '[/i]', d, 'calculations')">I</button>
              </div>
            </div>
            <textarea id="inp-calculations" v-model="d.calculations" style="height:120px;"></textarea>
          </div>

          <div>
            <label>INVENTÁRIO / ARMAS</label>
            <div v-for="(item, i) in d.inventory" :key="'inv'+i" class="dynamic-item">
              <button class="btn-del" @click="remInv(i)" title="Remover Item">✕</button>
              <input type="text" v-model="item.name" placeholder="Nome do Item" style="margin-bottom:8px;">
              
              <div class="field-header">
                <label style="font-size:0.8em; color:#888;">Descrição</label>
                <div class="mini-toolbar">
                  <button class="mini-btn" @click="insertTag('inp-inv-'+i, '[b]', '[/b]', d.inventory, 'desc', i)">B</button>
                  <button class="mini-btn" @click="insertTag('inp-inv-'+i, '[i]', '[/i]', d.inventory, 'desc', i)">I</button>
                </div>
              </div>
              <textarea :id="'inp-inv-'+i" v-model="item.desc" placeholder="Descrição/Efeito" style="min-height:50px;"></textarea>
            </div>
            <button class="btn btn-secondary" @click="addInv">+ ADC ITEM</button>
          </div>

          <div>
            <label style="margin-top:20px;">TÉCNICAS USADAS</label>
            <div v-for="(tech, i) in d.techniques" :key="'tech'+i" class="dynamic-item">
              <button class="btn-del" @click="remTech(i)" title="Remover Técnica">✕</button>
              <input type="text" v-model="tech.name" placeholder="Nome da Técnica" style="margin-bottom:8px;">
              
              <div class="field-header">
                <label style="font-size:0.8em; color:#888;">Descrição</label>
                <div class="mini-toolbar">
                  <button class="mini-btn" @click="insertTag('inp-tech-'+i, '[b]', '[/b]', d.techniques, 'desc', i)">B</button>
                  <button class="mini-btn" @click="insertTag('inp-tech-'+i, '[i]', '[/i]', d.techniques, 'desc', i)">I</button>
                </div>
              </div>
              <textarea :id="'inp-tech-'+i" v-model="tech.desc" placeholder="Descrição" style="min-height:50px;"></textarea>
            </div>
            <button class="btn btn-secondary" @click="addTech">+ ADC TÉCNICA</button>
          </div>
        </div>

        <div class="editor-content-wrapper" v-show="activeTab === 'calc'">
          <div class="smart-read-box">
            <label style="margin-bottom:10px; color:var(--bit-cyan);">LEITURA INTELIGENTE DE BÔNUS (NÃO FUNCIONA!)</label>
            <textarea v-model="calc.smartText" placeholder="Cole os blocos de cálculo aqui... ou não, pq não funciona"></textarea>
            <button class="btn btn-primary" style="font-size: 0.8em; padding: 10px;" @click="processSmartText">PROCESSAR E DISTRIBUIR</button>
          </div>

          <div class="row" style="margin-bottom:15px; background: rgba(0,0,0,0.5); padding: 15px; border: 2px solid var(--bit-border); border-radius: 4px;">
            <label class="checkbox-wrap"><input type="checkbox" v-model="calc.includeSpeed"> [ INJETAR VELOCIDADE ]</label>
            <label class="checkbox-wrap" style="margin-left: 20px;"><input type="checkbox" v-model="calc.includeDmg"> [ INJETAR AÇÃO ]</label>
          </div>

          <div class="calc-box" :style="{ opacity: calc.includeSpeed ? '1' : '0.4' }">
            <label style="color:var(--bit-cyan); border:none; margin-bottom:10px;">VELOCIDADE (m/s)</label>
            <div class="row">
              <div class="col"><label style="font-size:0.8em; color:#888;">Destreza</label><input type="number" v-model="calc.dex"></div>
              <div class="col"><label style="font-size:0.8em; color:#888;">Celeridade</label><input type="number" v-model="calc.cel"></div>
              <div class="col"><label style="font-size:0.8em; color:#888;">Outros (+)</label><input type="number" v-model="calc.extraSpeed"></div>
            </div>
            <label class="checkbox-wrap" style="margin-top:15px; font-size: 1em;">
              <input type="checkbox" v-model="calc.refSpeed"> Reforço Ativo (+5)
            </label>
            <div class="calc-result" style="color:var(--bit-cyan);">> {{ totalSpeed }} m/s</div>
          </div>

          <div class="calc-box" :style="{ opacity: calc.includeDmg ? '1' : '0.4' }">
            <div class="row" style="align-items: center; margin-bottom: 15px;">
               <label style="color:var(--bit-purple); font-size:1.2em;">AÇÃO:</label>
               <input type="text" v-model="calc.actionName" placeholder="Nome do Ataque/Técnica" style="flex:1;">
            </div>

            <div class="nested-grid" style="border-color: var(--bit-purple);">
                <label style="font-size:0.9em; color:var(--bit-text); border:none;">DANO BASE (ARMAS / TÉCNICAS)</label>
                <div class="row" style="margin-bottom: 8px;">
                  <div class="col"><input type="number" v-model="calc.baseVal" placeholder="Valor Base Inicial"></div>
                </div>
                
                <div v-for="(b, i) in calc.baseBonus" :key="'bb'+i" class="row nested-row" style="padding-left: 10px;">
                  <span style="color:#888; font-size:2.5em; line-height: 0; transform: translateY(4px); display: inline-block; margin-right: 5px;">↳</span>
                  <div class="col" style="flex:2"><input type="text" v-model="b.nome" placeholder="Nome"></div>
                  <div class="col"><input type="number" v-model="b.val" placeholder="Valor"></div>
                  <select v-model="b.unidade">
                    <option value="Fixo">Pts (Fixo)</option>
                    <option value="%">% (Porcentagem)</option>
                  </select>
                  <button class="del-line" @click="remBaseBonus(i)">✕</button>
                </div>
                <button class="btn-add-line" @click="addBaseBonus" style="border-color:var(--bit-purple); color:var(--bit-cyan); background:rgba(155, 0, 255, 0.05);">+ ADC MODIFICADOR NA BASE</button>
            </div>

            <label style="font-size:0.9em; color:var(--bit-text); margin-top:20px;">ATRIBUTOS ENVOLVIDOS</label>
            <div v-for="(atr, i) in calc.atributos" :key="'catr'+i" class="nested-grid" style="border-color: var(--bit-border);">
                <div class="row nested-row" style="margin-bottom: 8px;">
                  <div class="col" style="flex:1.5"><input type="text" v-model="atr.nome" placeholder="Ex: Força"></div>
                  <div class="col"><input type="number" v-model="atr.pts" placeholder="Pontos no Atributo"></div>
                  <button class="del-line" style="color:#ff3366;" @click="remAtr(i)">✕ Remover Atributo</button>
                </div>
                
                <div v-for="(b, j) in atr.bonus" :key="'ab'+i+j" class="row nested-row" style="padding-left: 10px;">
                  <span style="color:#888; font-size:2.5em; line-height: 0; transform: translateY(4px); display: inline-block; margin-right: 5px;">↳</span>
                  <div class="col" style="flex:1.5"><input type="text" v-model="b.nome" placeholder="Nome"></div>
                  <div class="col"><input type="number" v-model="b.val" placeholder="Valor"></div>
                  <select v-model="b.unidade">
                    <option value="Fixo">Pts (Fixo)</option>
                    <option value="%">%</option>
                  </select>
                  <button class="del-line" @click="remAtrBonus(i, j)">✕</button>
                </div>
                <button class="btn-add-line" style="font-size:0.8em; padding: 4px; width: 60%; align-self: flex-end;" @click="addAtrBonus(i)">+ ADC MODIFICADOR NESTE ATRIBUTO</button>
            </div>
            <button class="btn-add-line" style="background: rgba(155, 0, 255, 0.1); border-style: solid;" @click="addAtr">+ ADICIONAR ATRIBUTO</button>

            <label style="font-size:0.9em; color:var(--bit-text); margin-top:20px;">APTIDÕES ENVOLVIDAS</label>
            <div v-for="(apt, i) in calc.aptidoes" :key="'capt'+i" class="nested-grid" style="border-color: var(--bit-border);">
                <div class="row nested-row" style="margin-bottom: 8px;">
                  <div class="col" style="flex:1.5"><input type="text" v-model="apt.nome" placeholder="Ex: Luta"></div>
                  <div class="col"><input type="number" v-model="apt.pts" placeholder="Nível"></div>
                  <div class="col"><input type="number" v-model="apt.mult" placeholder="Multiplicador"></div>
                  <button class="del-line" style="color:#ff3366;" @click="remApt(i)">✕ Remover Aptidão</button>
                </div>

                <div v-for="(b, j) in apt.bonus" :key="'apb'+i+j" class="row nested-row" style="padding-left: 10px;">
                  <span style="color:#888; font-size:2.5em; line-height: 0; transform: translateY(4px); display: inline-block; margin-right: 5px;">↳</span>
                  <div class="col" style="flex:1.5"><input type="text" v-model="apt.nome" placeholder="Nome"></div>
                  <div class="col"><input type="number" v-model="b.val" placeholder="Valor"></div>
                  <select v-model="b.unidade">
                    <option value="Fixo">Pts (Fixo)</option>
                    <option value="%">%</option>
                  </select>
                  <button class="del-line" @click="remAptBonus(i, j)">✕</button>
                </div>
                <button class="btn-add-line" style="font-size:0.8em; padding: 4px; width: 60%; align-self: flex-end;" @click="addAptBonus(i)">+ ADC MODIFICADOR NESTA APTIDÃO</button>
            </div>
            <button class="btn-add-line" style="background: rgba(155, 0, 255, 0.1); border-style: solid;" @click="addApt">+ ADICIONAR APTIDÃO</button>

            <label style="font-size:0.9em; color:var(--bit-text); margin-top:20px;">MODIFICADORES GLOBAIS / FINAIS</label>
            <div class="nested-grid" style="border-color: var(--bit-text);">
                <div v-for="(mod, i) in calc.modificadores" :key="'cmod'+i" class="row nested-row">
                  <div class="col" style="flex:2"><input type="text" v-model="mod.nome" placeholder="Ex: Crescimento Acelerado"></div>
                  <div class="col"><input type="number" v-model="mod.val" placeholder="Valor"></div>
                  <select v-model="mod.unidade">
                    <option value="%">% (Porcentagem)</option>
                    <option value="Fixo">Pts (Fixo)</option>
                  </select>
                  <button class="del-line" @click="remMod(i)">✕</button>
                </div>
                <button class="btn-add-line" @click="addMod">+ ADICIONAR MODIFICADOR GLOBAL</button>
            </div>

            <label style="font-size:0.9em; color:#ff3366; margin-top:20px;">DEBUFFS E REDUÇÕES</label>
            <div v-for="(d, i) in calc.debuffs" :key="'deb'+i" style="background: rgba(255, 51, 102, 0.05); border: 2px dashed #ff3366; border-radius: 4px; padding: 10px; margin-bottom: 10px;">
              <div class="row nested-row">
                <div class="col" style="flex:1.5"><input type="text" v-model="d.nome" placeholder="Ex: Congelamento"></div>
                <div class="col"><input type="number" v-model="d.val" placeholder="Valor"></div>
                <select v-model="d.unidade">
                  <option value="Fixo">Pts (Fixo)</option>
                  <option value="%">% (Porcentagem)</option>
                </select>
                <select v-model="d.alvo">
                  <option value="Base">Na Base</option>
                  <option value="Bônus Específico">Em Bônus</option>
                  <option value="Final">No Final</option>
                </select>
                <button class="del-line" @click="remDebuff(i)">✕</button>
              </div>
              <div class="row nested-row" v-if="d.alvo === 'Bônus Específico'" style="margin-top: 5px;">
                <span style="color:#888; font-size:2.5em; line-height: 0; transform: translateY(4px); display: inline-block; margin-right: 5px;">↳</span>
                <div class="col" style="flex: 1;"><input type="text" v-model="d.alvoNome" placeholder="Qual bônus alvo?" style="border-color: var(--bit-purple);"></div>
              </div>
            </div>
            <button class="btn-add-line" style="border-color:#ff3366; color:#ff3366; background:rgba(255, 51, 102, 0.1);" @click="addDebuff">+ ADICIONAR DEBUFF</button>

            <div class="row" style="margin-top:20px; margin-bottom:15px; background:rgba(0,0,0,0.5); padding:15px; border-radius:4px; border: 1px solid var(--bit-border);">
              <label class="checkbox-wrap" style="font-size: 1em; color: var(--bit-cyan);"><input type="checkbox" v-model="calc.isCrit"> Crítico (x2)</label>
              <label class="checkbox-wrap" style="color:var(--bit-purple); font-size: 1em;"><input type="checkbox" v-model="calc.isKokusen"> Kokusen (x2.5)</label>
            </div>
            <div class="calc-result" style="color:var(--bit-cyan);">> {{ totalDmg }} pts</div>
          </div>

          <button class="btn btn-primary" style="font-size: 1em;" @click="injectCalcToNotes">INJETAR MATEMÁTICA NO DOSSIÊ</button>
        </div>

      </div>
    </div>

    <div class="preview-pane">
      <div class="preview-shell">
        <div class="preview-toolbar">
          <label>Zoom do preview</label>
          <input type="range" min="70" max="110" step="5" v-model="previewScale">
          <button class="btn btn-secondary" style="width:auto; font-size:0.52em; padding:9px 12px;" @click="renderPreview">ATUALIZAR</button>
        </div>
        <div id="preview-box" :style="{ transform: `scale(${previewScale / 100})`, transformOrigin: 'top center' }"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const { createApp, ref, watch, onMounted, nextTick, computed } = Vue;
  const STORAGE_KEY = 'dossier_terminal_v4_calc';
  
  const EMPTY_DATA = { 
    img: "https://i.pinimg.com/736x/ed/54/c6/ed54c6dcaaa0bf1681a35652bea0c3f2.jpg",
    title: "Título da Postagem", subtitle: "Local / Data / Turno", 
    hp: "100/100", ea: "100/100", san: "100/100",
    body: "Sua narração começa aqui.", 
    obj: "Sobreviver", words: "0", turn: "01", act_off: "0", act_def: "0", act_sup: "0", act_free: "0", 
    lifestyle: "Pleno", lifestyle_link: "", notes: "", summary: "", effects: "", aptitudes: "", calculations: "", 
    inventory: [], techniques: []
  };

  const EMPTY_CALC = {
    includeSpeed: true, includeDmg: true, actionName: '',
    dex: '', cel: '', extraSpeed: '', refSpeed: false,
    baseVal: '', baseBonus: [],
    atributos: [], aptidoes: [], modificadores: [], debuffs: [],
    isCrit: false, isKokusen: false, smartText: ''
  };

  createApp({
    setup() {
      const d = ref(JSON.parse(JSON.stringify(EMPTY_DATA)));
      const calc = ref(JSON.parse(JSON.stringify(EMPTY_CALC)));
      const activeTab = ref('editor');
      const showImportModal = ref(false);
      const importCode = ref('');
      const colorPick = ref('#a050ff');
      const toast = ref('');
      const previewScale = ref(100);
      let toastTimer = null;

      const notify = (message) => {
        toast.value = message;
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.value = ''; }, 2600);
      };

      const stripBBCode = (text) => String(text || '')
        .replace(/\[\/?(b|i|u|s|quote)\]/gi, '')
        .replace(/\[color=.*?\]/gi, '')
        .replace(/\[\/color\]/gi, '');

      const liveWordCount = computed(() => {
        const words = stripBBCode(d.value.body).trim().match(/\S+/g);
        return words ? words.length : 0;
      });

      onMounted(() => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) { 
           try { 
               const parsed = JSON.parse(saved);
               d.value = { ...EMPTY_DATA, ...parsed }; 
           } catch(e) {} 
        }
        
        if(!calc.value.baseBonus) calc.value.baseBonus = [];
        if(!calc.value.atributos) calc.value.atributos = [];
        if(!calc.value.aptidoes) calc.value.aptidoes = [];
        if(!calc.value.modificadores) calc.value.modificadores = [];
        if(!calc.value.debuffs) calc.value.debuffs = [];
        if(calc.value.smartText === undefined) calc.value.smartText = '';
        
        calc.value.atributos.forEach(a => { if(!a.bonus) a.bonus = []; });
        calc.value.aptidoes.forEach(a => { if(!a.bonus) a.bonus = []; });

        renderPreview();
      });

      let renderTimeout = null;
      watch(d, (newVal) => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(newVal));
        if(renderTimeout) clearTimeout(renderTimeout);
        renderTimeout = setTimeout(() => { renderPreview(); }, 300);
      }, { deep: true });

      const addInv = () => d.value.inventory.push({ name:"", desc:"" });
      const remInv = (i) => d.value.inventory.splice(i, 1);
      const addTech = () => d.value.techniques.push({ name:"", desc:"" });
      const remTech = (i) => d.value.techniques.splice(i, 1);

      const addBaseBonus = () => calc.value.baseBonus.push({nome: '', val: '', unidade: 'Fixo'});
      const remBaseBonus = (i) => calc.value.baseBonus.splice(i, 1);
      const addAtr = () => calc.value.atributos.push({nome: '', pts: '', bonus: []});
      const remAtr = (i) => calc.value.atributos.splice(i, 1);
      const addAtrBonus = (i) => calc.value.atributos[i].bonus.push({nome: '', val: '', unidade: '%'});
      const remAtrBonus = (i, j) => calc.value.atributos[i].bonus.splice(j, 1);
      const addApt = () => calc.value.aptidoes.push({nome: '', pts: '', mult: '', bonus: []});
      const remApt = (i) => calc.value.aptidoes.splice(i, 1);
      const addAptBonus = (i) => calc.value.aptidoes[i].bonus.push({nome: '', val: '', unidade: '%'});
      const remAptBonus = (i, j) => calc.value.aptidoes[i].bonus.splice(j, 1);
      const addMod = () => calc.value.modificadores.push({nome: '', val: '', unidade: '%'});
      const remMod = (i) => calc.value.modificadores.splice(i, 1);
      const addDebuff = () => calc.value.debuffs.push({nome: '', val: '', unidade: 'Fixo', alvo: 'Base', alvoNome: ''});
      const remDebuff = (i) => calc.value.debuffs.splice(i, 1);

      const processSmartText = () => {
          if (!calc.value.smartText) return;
          let text = String(calc.value.smartText).trim();
          let firstComma = text.indexOf(',');
          let firstPart = firstComma !== -1 ? text.substring(0, firstComma) : text;
          let baseMatch = firstPart.match(/^([A-Za-zÀ-ÿ\s\-_]+)\s+(\d+)/);
          if(baseMatch) {
              calc.value.actionName = baseMatch[1].trim();
              calc.value.baseVal = parseInt(baseMatch[2]);
              text = text.replace(baseMatch[0], '').trim();
              if(text.startsWith(',')) text = text.substring(1).trim();
          }

          let parts = text.split(/[,+]/);
          let rawItems = [];
          
          parts.forEach(part => {
              part = part.trim();
              if(!part) return;
              let numMatch = part.match(/(-?\d+)\s*(%?)/);
              if(!numMatch) return;
              let val = parseInt(numMatch[1]);
              let isPct = numMatch[2] === '%';
              let name = part.replace(numMatch[0], '').trim().replace(/^[-\s↳\+]+/, '');
              rawItems.push({ name, val: Math.abs(val), isPct, isDebuff: val < 0, processed: false });
          });

          const attrKeywords = ['força', 'forca', 'vitalidade', 'destreza', 'celeridade', 'inteligência', 'inteligencia', 'percepção', 'percepcao', 'energia', 'controle'];
          rawItems.forEach(item => {
              let nameLower = item.name.toLowerCase();
              let isAttrWord = attrKeywords.some(k => nameLower === k || nameLower.startsWith(k + " "));
              if (isAttrWord && !item.isPct && !item.isDebuff && item.val <= 50) {
                  calc.value.atributos.push({ nome: item.name, pts: item.val, bonus: [] });
                  item.processed = true;
              }
          });

          const aptKeywords = ['combate', 'desarmado', 'espadachim', 'luta', 'armas', 'pugilista', 'esgrima', 'tiro', 'perícia', 'pericia', 'feitiçaria', 'feiticaria', 'mágica', 'magica'];
          rawItems.forEach(item => {
              if (item.processed) return;
              let nameLower = item.name.toLowerCase();
              let isAptWord = aptKeywords.some(k => nameLower.includes(k));
              if ((isAptWord || item.val > 50) && !item.isPct && !item.isDebuff) {
                  calc.value.aptidoes.push({ nome: item.name, pts: item.val, mult: 1, bonus: [] });
                  item.processed = true;
              }
          });

          rawItems.forEach(item => {
              if (item.processed) return;
              let nameLower = item.name.toLowerCase();
              let parentAtr = calc.value.atributos.find(a => nameLower.includes(a.nome.toLowerCase()));
              if (parentAtr) {
                  parentAtr.bonus.push({ nome: item.name, val: item.val, unidade: item.isPct ? '%' : 'Fixo' });
                  item.processed = true;
                  return;
              }
              let parentApt = calc.value.aptidoes.find(a => nameLower.includes(a.nome.toLowerCase()));
              if (parentApt) {
                  parentApt.bonus.push({ nome: item.name, val: item.val, unidade: item.isPct ? '%' : 'Fixo' });
                  item.processed = true;
                  return;
              }
          });

          rawItems.forEach(item => {
              if (item.processed) return;
              if (item.isDebuff) {
                  calc.value.debuffs.push({ nome: item.name, val: item.val, unidade: item.isPct ? '%' : 'Fixo', alvo: 'Final', alvoNome: '' });
              } else {
                  calc.value.modificadores.push({ nome: item.name, val: item.val, unidade: item.isPct ? '%' : 'Fixo' });
              }
              item.processed = true;
          });

          calc.value.smartText = "";
          alert("Leitura inteligente concluída! Blocos organizados.");
      };

      const totalSpeed = computed(() => {
        let dex = Number(calc.value.dex) || 0;
        let cel = Number(calc.value.cel) || 0;
        let ref = calc.value.refSpeed ? 5 : 0;
        let extra = Number(calc.value.extraSpeed) || 0;
        return (dex * 10) + (cel * 2) + ref + extra;
      });

      const totalDmg = computed(() => {
        let totalFixed = Number(calc.value.baseVal) || 0;
        let totalPct = 0;

        (calc.value.baseBonus || []).forEach(b => {
            let v = Number(b.val) || 0;
            if(b.unidade === 'Fixo') totalFixed += v; else totalPct += v;
        });

        (calc.value.debuffs || []).forEach(d => {
            if (d.alvo === 'Base') {
                let v = Number(d.val) || 0;
                if(d.unidade === 'Fixo') totalFixed -= v; else totalPct -= v;
            }
        });

        let baseResult = totalFixed * (1 + totalPct/100);
        
        let atrResult = 0;
        (calc.value.atributos || []).forEach(a => {
            let aFixed = (Number(a.pts) || 0) * 10;
            let aPct = 0;
            if(a.bonus) a.bonus.forEach(b => {
                let v = Number(b.val) || 0;
                if(b.unidade === 'Fixo') aFixed += v; else aPct += v;
            });
            (calc.value.debuffs || []).forEach(d => {
                if (d.alvo === 'Bônus Específico' && d.alvoNome && a.nome && d.alvoNome.trim().toLowerCase() === a.nome.trim().toLowerCase()) {
                    let v = Number(d.val) || 0;
                    if(d.unidade === 'Fixo') aFixed -= v; else aPct -= v;
                }
            });
            atrResult += aFixed * (1 + aPct/100);
        });

        let aptResult = 0;
        (calc.value.aptidoes || []).forEach(a => {
            let apFixed = (Number(a.pts) || 0) * (Number(a.mult) || 0);
            let apPct = 0;
            if(a.bonus) a.bonus.forEach(b => {
                let v = Number(b.val) || 0;
                if(b.unidade === 'Fixo') apFixed += v; else apPct += v;
            });
            (calc.value.debuffs || []).forEach(d => {
                if (d.alvo === 'Bônus Específico' && d.alvoNome && a.nome && d.alvoNome.trim().toLowerCase() === a.nome.trim().toLowerCase()) {
                    let v = Number(d.val) || 0;
                    if(d.unidade === 'Fixo') apFixed -= v; else apPct -= v;
                }
            });
            aptResult += apFixed * (1 + apPct/100);
        });

        let sumFixed = baseResult + atrResult + aptResult;
        let globalFixed = 0;
        let globalPct = 0;

        (calc.value.modificadores || []).forEach(m => {
            let v = Number(m.val) || 0;
            if(m.unidade === 'Fixo') globalFixed += v; else globalPct += v;
        });

        sumFixed += globalFixed; 
        let final = sumFixed * (1 + globalPct/100);
        
        if (calc.value.isCrit) final *= 2;
        if (calc.value.isKokusen) final *= 2.5;

        let finalDebuffFixed = 0;
        let finalDebuffPct = 0;
        (calc.value.debuffs || []).forEach(d => {
            if (d.alvo === 'Final') {
                let v = Number(d.val) || 0;
                if(d.unidade === 'Fixo') finalDebuffFixed += v; else finalDebuffPct += v;
            }
        });

        final -= finalDebuffFixed;
        final = final * (1 - finalDebuffPct/100);

        return Math.floor(final);
      });

      const injectCalcToNotes = () => {
        let injectString = "";
        
        if (calc.value.includeSpeed) {
            let speedFormula = `[b]Velocidade:[/b] (Dex: ${calc.value.dex||0} x 10) + (Cel: ${calc.value.cel||0} x 2)`;
            if(calc.value.refSpeed) speedFormula += ` + (Reforço: 5)`;
            if(calc.value.extraSpeed) speedFormula += ` + (Extra: ${calc.value.extraSpeed})`;
            speedFormula += ` = ${totalSpeed.value} m/s`;
            injectString += speedFormula;
        }

        if (calc.value.includeDmg) {
            let actionTitle = calc.value.actionName ? calc.value.actionName.toUpperCase() : 'AÇÃO / DANO';
            let fixedParts = [];
            let pctParts = [];
            let finalParts = [];

            let baseV = Number(calc.value.baseVal) || 0;
            if (baseV !== 0) fixedParts.push(`${baseV} Base`);
            
            (calc.value.baseBonus || []).forEach(b => {
                if(b.nome || b.val) {
                    if(b.unidade === 'Fixo') fixedParts.push(`+${b.val} (${b.nome})`);
                    else pctParts.push(`+${b.val}% (${b.nome})`);
                }
            });

            (calc.value.debuffs || []).forEach(d => {
                if(d.alvo === 'Base' && (d.nome || d.val)) {
                    if(d.unidade === 'Fixo') fixedParts.push(`-${d.val} (${d.nome})`);
                    else pctParts.push(`-${d.val}% (${d.nome})`);
                }
            });

            (calc.value.atributos || []).forEach(a => {
                if(a.nome || a.pts) {
                    fixedParts.push(`+${(Number(a.pts)||0)*10} (${a.nome})`);
                    if(a.bonus) a.bonus.forEach(b => {
                        if(b.unidade === 'Fixo') fixedParts.push(`+${b.val} (${b.nome})`);
                        else pctParts.push(`+${b.val}% (${b.nome})`);
                    });
                    (calc.value.debuffs || []).forEach(d => {
                        if (d.alvo === 'Bônus Específico' && d.alvoNome && a.nome && d.alvoNome.trim().toLowerCase() === a.nome.trim().toLowerCase()) {
                            let label = `${d.nome} em ${a.nome}`;
                            if(d.unidade === 'Fixo') fixedParts.push(`-${d.val} (${label})`);
                            else pctParts.push(`-${d.val}% (${label})`);
                        }
                    });
                }
            });

            (calc.value.aptidoes || []).forEach(a => {
                if(a.nome || a.pts) {
                    fixedParts.push(`+${(Number(a.pts)||0)*(Number(a.mult)||0)} (${a.nome})`);
                    if(a.bonus) a.bonus.forEach(b => {
                        if(b.unidade === 'Fixo') fixedParts.push(`+${b.val} (${b.nome})`);
                        else pctParts.push(`+${b.val}% (${b.nome})`);
                    });
                    (calc.value.debuffs || []).forEach(d => {
                        if (d.alvo === 'Bônus Específico' && d.alvoNome && a.nome && d.alvoNome.trim().toLowerCase() === a.nome.trim().toLowerCase()) {
                            let label = `${d.nome} em ${a.nome}`;
                            if(d.unidade === 'Fixo') fixedParts.push(`-${d.val} (${label})`);
                            else pctParts.push(`-${d.val}% (${label})`);
                        }
                    });
                }
            });

            (calc.value.modificadores || []).forEach(m => {
                if(m.nome || m.val) {
                    if(m.unidade === 'Fixo') fixedParts.push(`+${m.val} (${m.nome})`);
                    else pctParts.push(`+${m.val}% (${m.nome})`);
                }
            });

            (calc.value.debuffs || []).forEach(d => {
                if(d.alvo === 'Final' && (d.nome || d.val)) {
                    if(d.unidade === 'Fixo') finalParts.push(`-${d.val} Fixo (${d.nome})`);
                    else finalParts.push(`-${d.val}% (${d.nome})`);
                }
            });

            let formulaStr = `[b]${actionTitle}:[/b] [ ${fixedParts.join(' ')} ]`;
            if (pctParts.length > 0) {
                let totalPctVal = 0;
                (calc.value.baseBonus || []).forEach(b => { if(b.unidade === '%') totalPctVal += Number(b.val)||0; });
                (calc.value.debuffs || []).forEach(d => { if(d.alvo === 'Base' && d.unidade === '%') totalPctVal -= Number(d.val)||0; });
                (calc.value.atributos || []).forEach(a => {
                    if(a.bonus) a.bonus.forEach(b => { if(b.unidade === '%') totalPctVal += Number(b.val)||0; });
                    (calc.value.debuffs || []).forEach(d => { if (d.alvo === 'Bônus Específico' && d.alvoNome && a.nome && d.alvoNome.trim().toLowerCase() === a.nome.trim().toLowerCase() && d.unidade === '%') totalPctVal -= Number(d.val)||0; });
                });
                (calc.value.aptidoes || []).forEach(a => {
                    if(a.bonus) a.bonus.forEach(b => { if(b.unidade === '%') totalPctVal += Number(b.val)||0; });
                    (calc.value.debuffs || []).forEach(d => { if (d.alvo === 'Bônus Específico' && d.alvoNome && a.nome && d.alvoNome.trim().toLowerCase() === a.nome.trim().toLowerCase() && d.unidade === '%') totalPctVal -= Number(d.val)||0; });
                });
                (calc.value.modificadores || []).forEach(m => { if(m.unidade === '%') totalPctVal += Number(m.val)||0; });
                
                formulaStr += ` com ${totalPctVal}% de Multiplicador acumulado [ ${pctParts.join(' ')} ]`;
            }
            if (calc.value.isCrit) formulaStr += ` * [ CRÍTICO (x2) ]`;
            if (calc.value.isKokusen) formulaStr += ` * [ KOKUSEN (x2.5) ]`;
            if (finalParts.length > 0) formulaStr += ` [ Reduções Finais: ${finalParts.join(' ')} ]`;
            
            formulaStr += ` = ${totalDmg.value} pts`;

            if (injectString !== "") injectString += "\n";
            injectString += formulaStr;
        }

        if (injectString === "") { alert("Selecione pelo menos uma opção para injetar!"); return; }
        
        let existingCalc = d.value.calculations || '';
        d.value.calculations = existingCalc ? existingCalc + '\n\n' + injectString : injectString;
        alert("Fórmula Matemática injetada na aba DOSSIÊ!");
        activeTab.value = 'status';
      };

      const parseBBCode = (text) => {
        if(!text) return '';
        return String(text).replace(/\n/g, '<br>')
          .replace(/\[b\](.*?)\[\/b\]/gs, '<b>$1</b>')
          .replace(/\[i\](.*?)\[\/i\]/gs, '<i>$1</i>')
          .replace(/\[u\](.*?)\[\/u\]/gs, '<u>$1</u>')
          .replace(/\[s\](.*?)\[\/s\]/gs, '<s>$1</s>')
          .replace(/\[quote\](.*?)\[\/quote\]/gs, '<blockquote>$1</blockquote>')
          .replace(/\[color=(.*?)\](.*?)\[\/color\]/gs, '<span style="color:$1">$2</span>');
      };

      const insertTag = (id, startTag, endTag, targetObj, key, index = null) => { 
        const el = document.getElementById(id); 
        if (el) { 
          const s = el.selectionStart; const e = el.selectionEnd; 
          const t = index !== null ? targetObj[index][key] : targetObj[key]; 
          const newVal = t.substring(0, s) + startTag + t.substring(s, e) + endTag + t.substring(e); 
          
          if (index !== null) targetObj[index][key] = newVal;
          else targetObj[key] = newVal;
          
          nextTick(() => { el.focus(); el.setSelectionRange(s+startTag.length, s+startTag.length+(e-s)); }); 
        } 
      };

      const getPct = (val) => {
        if(!val) return 0;
        const p = String(val).split('/');
        if (p.length !== 2) return 100;
        const current = parseFloat(p[0]);
        const max = parseFloat(p[1]);
        if (!Number.isFinite(current) || !Number.isFinite(max) || max <= 0) return 0;
        return Math.max(0, Math.min(100, (current / max) * 100));
      };

      const generateHTML = (isPreview = false) => {
        const bodyContent = isPreview ? parseBBCode(d.value.body) : parseBBCode(d.value.body);

        const styleHp = `style="width:${getPct(d.value.hp)}%"`;
        const styleEa = `style="width:${getPct(d.value.ea)}%"`;
        const styleSan = `style="width:${getPct(d.value.san)}%"`;
        const attrOpen = isPreview ? 'open' : '';

        const formatListItem = (text) => String(text || '').replace(/[>•]/g, '').split('\n').filter(line => line.trim() !== '').map(line => `<div class="rp-list-item">${parseBBCode(line.trim())}</div>`).join('');
        
        const invHTML = (d.value.inventory || []).map(i => `<div class="rp-list-item"><b>${(i.name || '').replace(/[>•]/g, '').trim()}:</b> ${parseBBCode((i.desc || '').replace(/[>•]/g, '').trim())}</div>`).join('');
        const techHTML = (d.value.techniques || []).map(i => `<div class="rp-list-item"><b>${(i.name || '').replace(/[>•]/g, '').trim()}:</b> ${parseBBCode((i.desc || '').replace(/[>•]/g, '').trim())}</div>`).join('');

        const renderArsenal = (d.value.inventory || []).length > 0 ? `<details class="rp-sub-dossier" ${attrOpen}><summary class="rp-title-inv"></summary><div class="rp-dossier-content">${invHTML}</div></details>` : '';
        const renderTechs = (d.value.techniques || []).length > 0 ? `<details class="rp-sub-dossier" ${attrOpen}><summary class="rp-title-tech"></summary><div class="rp-dossier-content">${techHTML}</div></details>` : '';

        const vigorHTML = d.value.lifestyle_link ? `<a href="${d.value.lifestyle_link}">${d.value.lifestyle}</a>` : d.value.lifestyle;
        
        let formattedNotes = (d.value.notes || '').replace(/[>•]/g, '').trim();
        const renderNotes = formattedNotes ? `<div class="rp-list-title rp-title-notes"></div><div class="rp-post-extras-content">${parseBBCode(formattedNotes)}</div>` : '';

        let formattedSummary = (d.value.summary || '').replace(/[>•]/g, '').trim();
        const renderSummary = formattedSummary ? `<div class="rp-list-title rp-title-summary"></div><div class="rp-post-extras-content">${parseBBCode(formattedSummary)}</div>` : '';

        let formattedEffects = (d.value.effects || '').replace(/[>•]/g, '').trim();
        const renderEffects = formattedEffects ? `<div class="rp-list-title rp-title-effects"></div><div class="rp-post-extras-content">${parseBBCode(formattedEffects)}</div>` : '';

        const renderApts = (d.value.aptitudes || '').trim() ? `<div class="rp-list-title rp-title-aptitudes"></div>${formatListItem(d.value.aptitudes)}` : '';
        const renderCalc = (d.value.calculations || '').trim() ? `<div class="rp-list-title rp-title-calc"></div><div class="rp-post-extras-content">${parseBBCode((d.value.calculations || '').trim())}</div>` : '';

        const metaRibbon = `<div class="rp-post-meta-ribbon"><span class="rp-meta-chip">Turno <b>${d.value.turn}</b></span><span class="rp-meta-chip">Palavras <b>${d.value.words || liveWordCount.value}</b></span><span class="rp-meta-chip">Vigor <b>${d.value.lifestyle}</b></span></div>`;

        return `<link href="https://goldenagerpg.github.io/templates.io/dossier_v4.css" rel="stylesheet" type="text/css"><div class="rp-post-container jjk-dossier-container"><div class="rp-post-image-wrapper"><img src="${d.value.img}" alt=""><div class="overlay vignette-overlay"></div><div class="overlay grid-overlay"></div><div class="frame-corners"><span class="corner top-left"></span><span class="corner top-right"></span><span class="corner bottom-right"></span><span class="corner bottom-left"></span></div></div><div class="rp-post-header"><h2 class="post-title">${d.value.title}</h2><p class="post-subtitle">${d.value.subtitle}</p>${metaRibbon}</div><div class="jjk-dossier-status-bars"><div class="jjk-dossier-status-item"><span class="jjk-dossier-status-label">HP</span><div class="jjk-dossier-status-bar-wrapper"><div class="jjk-dossier-status-bar"><div class="jjk-dossier-status-bar-fill jjk-dossier-hp-fill" ${styleHp}></div></div><span class="jjk-dossier-status-value">${d.value.hp}</span></div></div><div class="jjk-dossier-status-item"><span class="jjk-dossier-status-label">EA</span><div class="jjk-dossier-status-bar-wrapper"><div class="jjk-dossier-status-bar"><div class="jjk-dossier-status-bar-fill jjk-dossier-ea-fill" ${styleEa}></div></div><span class="jjk-dossier-status-value">${d.value.ea}</span></div></div><div class="jjk-dossier-status-item"><span class="jjk-dossier-status-label">SAN</span><div class="jjk-dossier-status-bar-wrapper"><div class="jjk-dossier-status-bar"><div class="jjk-dossier-status-bar-fill jjk-dossier-san-fill" ${styleSan}></div></div><span class="jjk-dossier-status-value">${d.value.san}</span></div></div></div><div class="rp-post-content">${bodyContent}</div><details class="rp-dossier" ${attrOpen}><summary>Sistema</summary><div class="rp-dossier-content"><div class="rp-grid"><div class="rp-data-box"><span class="rp-data-lbl">Objetivo</span><span class="rp-data-val">${d.value.obj}</span></div><div class="rp-data-box"><span class="rp-data-lbl">Palavras</span><span	class("rp-data-val">${d.value.words || liveWordCount.value}</span></div><<div	class("rp-data-box"><span	class("rp-data-lbl">Turno</span><span	class("rp-data-val">${d.value.turn}</span></ div >< div	class("rp-data-box") >< span	class("rp-data-lbl") >Vigor</ span >< span	class("rp-data-val") >${vigorHTML}</ span ></ div ></ div >< div	class("rp-act-grid") >< div	class("rp-act-item") >ATK < span >${d.value.act_off}</ span ></ div >< div	class("rp-act-item") >DEF < span >${d.value.act_def}</ span ></ div >< div	class("rp-act-item") >SUP < span >${d.value.act_sup}</ span ></ div >< div	class("rp-act-item") >LIV < span >${d.value.act_free}</ span ></ div ></ div >${renderNotes}${renderSummary}${renderEffects}${renderApts}${renderCalc}${renderArsenal}${renderTechs}</ div ></ details ></ div >`;
      };

      const renderPreview = () => {
        const frame = document.getElementById('preview-box');
        if (frame) frame.innerHTML = generateHTML(true);
      };

      const processImport = () => {
        try {
          const parser = new DOMParser();
          const doc = parser.parseFromString(importCode.value, 'text/html');
          
          d.value.img = doc.querySelector('.rp-post-image-wrapper img')?.getAttribute('src') || '';
          d.value.title = doc.querySelector('.post-title')?.innerText || '';
          d.value.subtitle = doc.querySelector('.post-subtitle')?.innerText || '';
          
          const stats = doc.querySelectorAll('.jjk-dossier-status-value');
          if(stats.length >= 3) {
            d.value.hp = stats[0].innerText; d.value.ea = stats[1].innerText; d.value.san = stats[2].innerText;
          }

          const reverseBB = (html) => { 
            if(!html) return ""; 
            let t = String(html).replace(/<br\s*\/?>/gi, '\n'); 
            t = t.replace(/<b>(.*?)<\/b>/gi, '[b]$1[/b]')
                 .replace(/<i>(.*?)<\/i>/gi, '[i]$1[/i]')
                 .replace(/<u>(.*?)<\/u>/gi, '[u]$1[/u]')
                 .replace(/<s>(.*?)<\/s>/gi, '[s]$1[/s]')
                 .replace(/<span style="color:(.*?)">(.*?)<\/span>/gi, '[color=$1]$2[/color]');
            return t.trim();
          };

          let bodyHTML = doc.querySelector('.rp-post-content')?.innerHTML || "";
          d.value.body = reverseBB(bodyHTML);
          
          const vals = doc.querySelectorAll('.rp-data-box .rp-data-val');
          if(vals.length >= 4) {
            d.value.obj = vals[0].innerText; d.value.words = vals[1].innerText;
            d.value.turn = vals[2].innerText;
            
            const linkEl = vals[3].querySelector('a');
            if (linkEl) {
                d.value.lifestyle = linkEl.innerText;
                d.value.lifestyle_link = linkEl.getAttribute('href');
            } else {
                d.value.lifestyle = vals[3].innerText;
                d.value.lifestyle_link = "";
            }
          }
          
          const pills = doc.querySelectorAll('.rp-act-grid .rp-act-item span');
          if(pills.length >= 4) {
             d.value.act_off = pills[0].innerText; d.value.act_def = pills[1].innerText;
             d.value.act_sup = pills[2].innerText; d.value.act_free = pills[3].innerText;
          }

          const parseListSection = (className) => {
             let items = [];
             let current = doc.querySelector(`.${className}`);
             if (!current) return "";
             current = current.nextElementSibling;
             while (current && current.classList.contains('rp-list-item')) {
                 items.push(reverseBB(current.innerHTML).replace(/[>•]/g, '').trim());
                 current = current.nextElementSibling;
             }
             return items.join('\n');
          };
          
          const parseTextSection = (titleClass) => {
             let current = doc.querySelector(`.${titleClass}`);
             if (!current || !current.nextElementSibling || !current.nextElementSibling.classList.contains('rp-post-extras-content')) return "";
             return reverseBB(current.nextElementSibling.innerHTML).replace(/[>•]/g, '').trim();
          };

          d.value.notes = parseTextSection('rp-title-notes');
          d.value.summary = parseTextSection('rp-title-summary');
          d.value.effects = parseTextSection('rp-title-effects');
          d.value.calculations = parseTextSection('rp-title-calc');
          d.value.aptitudes = parseListSection('rp-title-aptitudes');
          
          d.value.inventory = [];
          d.value.techniques = [];

          const subDrawers = doc.querySelectorAll('.rp-sub-dossier');
          if(subDrawers.length > 0) {
            subDrawers.forEach(drawer => {
              const summaryNode = drawer.querySelector('summary');
              const isInv = summaryNode.classList.contains('rp-title-inv');
              const isTech = summaryNode.classList.contains('rp-title-tech');
              const items = drawer.querySelectorAll('.rp-dossier-content .rp-list-item');
              
              items.forEach(item => {
                 const parts = item.innerHTML.split('</b>');
                 if(parts.length === 2) {
                     const obj = { 
                         name: parts[0].replace(/<[^>]*>?/gm, '').replace(':', '').replace(/[>•]/g, '').trim(), 
                         desc: reverseBB(parts[1].trim()).replace(/[>•]/g, '').trim() 
                     };
                     if(isInv) d.value.inventory.push(obj);
                     if(isTech) d.value.techniques.push(obj);
                 }
              });
            });
          }

          showImportModal.value = false;
          notify("Importação concluída.");
        } catch(e) { notify("Falha ao ler o HTML."); }
      };

      const resetData = () => { if(confirm("Apagar dados do terminal?")) { d.value = JSON.parse(JSON.stringify(EMPTY_DATA)); localStorage.removeItem(STORAGE_KEY); notify("Dados limpos."); } };
      
      const copyCode = () => { 
        let finalHtmlCode = generateHTML(false);
        navigator.clipboard.writeText(finalHtmlCode.replace(/(\r\n|\n|\r)/gm, "")).then(() => { notify("Código final copiado."); }); 
      };

      const copyPlainText = () => {
        navigator.clipboard.writeText(stripBBCode(d.value.body).trim()).then(() => { notify("Texto da narração copiado."); });
      };

      const downloadCode = () => {
        const fullDoc = `<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${d.value.title}</title></head><body>${generateHTML(false)}</body></html>`;
        const blob = new Blob([fullDoc], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${(d.value.title || 'postagem').toLowerCase().replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '') || 'postagem'}.html`;
        a.click();
        URL.revokeObjectURL(a.href);
        notify("HTML baixado.");
      };

      return { d, calc, activeTab, showImportModal, importCode, colorPick, toast, previewScale, liveWordCount, renderPreview, insertTag, processImport, resetData, copyCode, copyPlainText, downloadCode, totalSpeed, totalDmg, injectCalcToNotes, addInv, remInv, addTech, remTech, addAtr, remAtr, addApt, remApt, addMod, remMod, addBaseBonus, remBaseBonus, addAtrBonus, remAtrBonus, addAptBonus, remAptBonus, addDebuff, remDebuff, processSmartText };
    }
  }).mount('#app');
</script>
</body>
</html>
