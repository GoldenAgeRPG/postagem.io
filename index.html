<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJK Post Editor - 8Bit Ver.</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;700&family=Yuji+Syuku&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <style>
    /* --- 1. CSS DO PREVIEW (Fiel ao Fórum + Fix de Fundo) --- */
    #preview-container {
      --bg: #0a0a14; --panel: #101120; --text: #d4d8f0;
      --accent: #a050ff; --accent-dark: #6d20c5; --highlight: #c48fff;
      --radius: 8px; --hp-color: #FF50A0; --hp-dark: #C52070; --text-muted: #9FA3B9;
      font-family: 'Inter', sans-serif; line-height: 1.5; color: #e0e0e0;
    }
    .rp-post-container {
      box-sizing: border-box; width: 100%; font-family: 'Inter', sans-serif;
      color: var(--text); 
      background-color: #101120 !important; /* [FIX] Fundo Sólido */
      border-radius: var(--radius);
      position: relative; border: 1px solid rgba(160, 80, 255, 0.1);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); /* Sombra mais forte */
      padding: 20px; margin-bottom: 30px;
      z-index: 5; /* Garante que fique acima do grid */
    }
    .rp-post-container * { box-sizing: border-box; }
    .rp-post-image-wrapper { position: relative; border-radius: 4px; overflow: hidden; margin-bottom: 15px; }
    .rp-post-image-wrapper::before, .rp-post-image-wrapper::after {
      content: '呪術師'; position: absolute; top: 30px; left: 15px; font-family: 'Yuji Syuku', serif;
      font-size: 64px; letter-spacing: 15px; writing-mode: vertical-lr; pointer-events: none; z-index: 4;
    }
    .rp-post-image-wrapper::before { color: var(--accent); opacity: 0.6; text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent-dark); }
    .rp-post-image-wrapper::after { color: #fff; text-shadow: 0 0 5px #fff; opacity: 0.8; }
    .rp-post-image-wrapper img { display: block; width: 100%; height: auto; object-fit: cover; }
    .rp-post-image-wrapper .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .vignette-overlay { background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.7) 100%); }
    .frame-corners { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
    .frame-corners .corner { position: absolute; width: 20px; height: 20px; }
    .frame-corners .corner::before, .frame-corners .corner::after { content: ''; position: absolute; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .frame-corners .corner::before { width: 100%; height: 2px; }
    .frame-corners .corner::after { width: 2px; height: 100%; }
    .corner.top-left { top: 10px; left: 10px; }
    .corner.top-right { top: 10px; right: 10px; transform: rotate(90deg); }
    .corner.bottom-right { bottom: 10px; right: 10px; transform: rotate(180deg); }
    .corner.bottom-left { bottom: 10px; left: 10px; transform: rotate(270deg); }
    .rp-post-header { text-align: center; margin: 30px 0; }
    .post-title { font-family: 'Yuji Syuku', serif; font-size: 28px; color: var(--highlight); text-shadow: 0 0 10px var(--accent); margin: 0 0 10px 0; display: flex; align-items: center; gap: 15px; }
    .post-title::before, .post-title::after { content: ''; height: 1px; flex-grow: 1; background: linear-gradient(to right, transparent, var(--accent) 50%, transparent); opacity: 0.4; }
    .post-title::after { background: linear-gradient(to left, transparent, var(--accent) 50%, transparent); }
    .post-subtitle { font-family: 'Share Tech Mono', monospace; font-size: 13px; color: var(--text); text-transform: uppercase; letter-spacing: 1.5px; margin: 0; opacity: 0.8; }
    .jjk-dossier-status-bars { display: flex; flex-direction: column; gap: 6px; max-width: 450px; margin: 25px auto; }
    .jjk-dossier-status-item { display: flex; align-items: center; gap: 10px; }
    .jjk-dossier-status-label { font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: 700; width: 35px; flex-shrink: 0; color: var(--highlight); }
    .jjk-dossier-status-bar-wrapper { flex-grow: 1; position: relative; }
    .jjk-dossier-status-bar { height: 14px; background: rgba(0, 0, 0, .3); border-radius: 50px; overflow: hidden; border: 1px solid rgba(0, 0, 0, .2); }
    .jjk-dossier-status-bar-fill { height: 100%; border-radius: 50px; width: 100%; }
    .jjk-dossier-hp-fill { background: linear-gradient(90deg, var(--hp-dark), var(--hp-color)); }
    .jjk-dossier-ea-fill { background: linear-gradient(90deg, var(--accent-dark), var(--accent)); }
    .jjk-dossier-status-value { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Share Tech Mono', monospace; font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
    .rp-post-content { position: relative; background: rgba(0, 0, 0, 0.2); padding: 25px; border-radius: 4px; margin-top: 15px; font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text-muted); line-height: 1.7; box-shadow: inset 0 0 15px rgba(160, 80, 255, 0.1); }
    .rp-post-content::before, .rp-post-content::after { content: ''; position: absolute; width: 20px; height: 20px; opacity: 0.5; }
    .rp-post-content::before { top: 10px; left: 10px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
    .rp-post-content::after { bottom: 10px; right: 10px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }
    .rp-post-extras { margin-top: 15px; background: rgba(0, 0, 0, 0.5); border: 1px dashed var(--text-muted); border-radius: 4px; padding: 15px; position: relative; }
    .rp-post-extras::before { content: 'INFO // SISTEMA'; position: absolute; top: -10px; left: 15px; background: var(--panel); padding: 0 8px; font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--highlight); letter-spacing: 1px; font-weight: 700; }
    .rp-post-extras-content { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text-muted); line-height: 1.5; }
    .rp-post-content b, .rp-post-extras-content b { color: #fff; font-weight: bold; }
    .rp-post-content i, .rp-post-extras-content i { font-style: italic; }
    .rp-post-content u, .rp-post-extras-content u { text-decoration: underline; }
    .rp-post-content s, .rp-post-extras-content s { text-decoration: line-through; opacity: 0.6; }
    .spoiler-box { background: #000; color: #000; padding: 2px 5px; border-radius: 4px; cursor: help; border: 1px dashed #444; }
    .spoiler-box:hover { color: #fff; }

    /* --- 2. CSS DA INTERFACE (THEME JJK 8BIT) --- */
    :root {
      --bit-bg: #0e0b14;
      --bit-panel: #1a1625;
      --bit-purple: #9b00ff;
      --bit-cyan: #00e5ff;
      --bit-green: #00ff8c;
      --bit-border: #4a3b5e;
      --bit-text: #d8d8d8;
    }
    
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'VT323', monospace; background-color: var(--bit-bg); color: var(--bit-text); font-size: 18px; }
    
    /* Layout */
    .layout-grid { display: grid; grid-template-columns: 650px 1fr; height: 100%; width: 100%; }
    
    /* Esquerda: Editor "Console" */
    .editor-pane {
      background: var(--bit-panel);
      border-right: 4px solid var(--bit-border);
      display: flex; flex-direction: column; height: 100%; min-height: 0; z-index: 10;
      box-shadow: 10px 0 20px rgba(0,0,0,0.5);
    }

    .editor-header {
      padding: 20px;
      background: #110d1a;
      border-bottom: 4px solid var(--bit-purple);
      flex-shrink: 0;
    }
    .editor-header h1 { 
      margin: 0; font-family: 'Press Start 2P', cursive; color: var(--bit-cyan); 
      font-size: 1.2em; text-shadow: 3px 3px 0px #000; line-height: 1.5;
    }
    
    .editor-scroll-area { flex: 1 1 auto; overflow-y: auto; padding: 20px; }
    .editor-content-wrapper { display: flex; flex-direction: column; gap: 20px; padding-bottom: 100px; }

    /* Inputs "Retro" */
    .input-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 1.1em; color: var(--bit-purple); text-transform: uppercase; margin-bottom: 2px; display: block; text-shadow: 1px 1px 0 #000; }
    
    input, textarea {
      background: #050408; border: 2px solid var(--bit-border); color: #fff;
      padding: 10px; font-family: 'VT323', monospace; font-size: 1.2em; width: 100%; box-sizing: border-box;
      box-shadow: inset 3px 3px 0px rgba(0,0,0,0.5);
    }
    input:focus, textarea:focus { outline: none; border-color: var(--bit-cyan); background: #090810; }
    textarea { resize: vertical; line-height: 1.3; }
    
    #inp-content { min-height: 400px; font-size: 1.3em; border-top: none; }
    #inp-extra { min-height: 150px; border-top: none; }

    .row { display: flex; gap: 15px; }
    .col { flex: 1; }

    /* Toolbar 8-bit */
    .bbcode-toolbar {
      display: flex; gap: 5px; background: #252033; padding: 8px; 
      border: 2px solid var(--bit-border); border-bottom: none; flex-wrap: wrap;
      align-items: center;
    }
    
    /* Botões da Toolbar */
    .bb-btn {
      background: #4a3b5e; border: 2px solid #000; color: #fff;
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-family: 'Press Start 2P', cursive; font-size: 0.6em;
      box-shadow: 2px 2px 0px #000; position: relative;
    }
    .bb-btn:hover { background: var(--bit-purple); color: #fff; transform: translate(-1px, -1px); box-shadow: 3px 3px 0px #000; }
    .bb-btn:active { transform: translate(2px, 2px); box-shadow: none; }

    /* Botão de aplicar cor (Pincel) */
    .bb-btn.apply-color {
      background: var(--bit-cyan); color: #000;
    }
    
    /* Input Color Escondido mas clicável */
    .color-wrapper { position: relative; width: 32px; height: 32px; display: inline-block; }
    .color-wrapper input[type="color"] { 
      position: absolute; top:0; left:0; width: 100%; height: 100%; opacity: 0; cursor: pointer; 
      padding: 0; border: none;
    }
    /* Mostrador de cor selecionada */
    .color-indicator {
      width: 32px; height: 32px; border: 2px solid #000; background: #fff; 
      box-shadow: 2px 2px 0px #000; cursor: pointer;
    }

    /* Botões Grandes */
    .btn {
      padding: 15px; border: 2px solid #000; font-family: 'Press Start 2P', cursive; font-size: 0.8em;
      cursor: pointer; width: 100%; text-transform: uppercase; text-align: center;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.5); transition: transform 0.1s;
    }
    .btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0px rgba(0,0,0,0.5); }
    .btn:active { transform: translate(4px, 4px); box-shadow: none; }
    
    .btn-primary { background: var(--bit-purple); color: #fff; }
    .btn-secondary { background: #333; color: #ccc; }
    .btn-success { background: var(--bit-green); color: #000; }

    /* Direita: Preview */
    .preview-pane { 
      background: #050505; 
      /* Grid pattern */
      background-image: 
        linear-gradient(rgba(30, 30, 30, 0.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 30, 30, 0.5) 1px, transparent 1px);
      background-size: 40px 40px;
      overflow-y: auto; height: 100%; display: flex; justify-content: center; padding: 40px; box-sizing: border-box; 
    }
    #preview-box { width: 100%; max-width: 700px; }

    /* Modal Genérico */
    #generic-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: none; align-items: center; justify-content: center; }
    .modal-box { background: var(--bit-panel); padding: 20px; border: 4px solid var(--bit-purple); width: 90%; max-width: 400px; box-shadow: 10px 10px 0px #000; text-align: center; }
    .modal-input { margin: 15px 0; background: #000; border: 2px solid #fff; color: #fff; font-size: 1.2em; text-align: center; }

    /* Modal Importar */
    #import-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; align-items: center; justify-content: center; }

    /* Mobile */
    @media (max-width: 1100px) {
      .layout-grid { grid-template-columns: 1fr; display: block; overflow: auto; height: auto; }
      .editor-pane { height: auto; min-width: 100%; border-right: none; }
      .editor-scroll-area { overflow: visible; }
      .preview-pane { min-height: 100vh; padding: 20px 10px; }
      html, body { overflow: auto; height: auto; }
    }
  </style>
</head>
<body>

  <div id="generic-modal">
    <div class="modal-box">
      <h3 id="modal-title" style="margin-top:0; color:var(--bit-cyan); font-family:'Press Start 2P'; font-size:0.8em;">TÍTULO</h3>
      <input type="text" id="modal-input-field" class="modal-input" placeholder="...">
      <div class="row">
        <button class="btn btn-primary" id="modal-confirm-btn">OK</button>
        <button class="btn btn-secondary" onclick="closeModal()">CANCELAR</button>
      </div>
    </div>
  </div>

  <div id="import-modal">
    <div class="modal-box" style="max-width: 500px;">
      <h3 style="margin-top:0; color:var(--bit-cyan); font-family:'Press Start 2P'; font-size:0.8em; line-height:1.5;">IMPORTAR DADOS</h3>
      <textarea id="import-area" style="height:120px; margin-bottom:10px;" placeholder="Cole o HTML da postagem aqui..."></textarea>
      <div class="row">
        <button class="btn btn-primary" onclick="runImport()">CARREGAR</button>
        <button class="btn btn-secondary" onclick="document.getElementById('import-modal').style.display='none'">CANCELAR</button>
      </div>
    </div>
  </div>

  <div class="layout-grid">
    <div class="editor-pane">
      <div class="editor-header">
        <h1>POST EDITOR</h1>
        <div class="row" style="margin-top:15px;">
          <button class="btn btn-secondary" style="font-size:0.6em; padding:10px;" onclick="document.getElementById('import-modal').style.display='flex'">IMPORTAR</button>
          <button class="btn btn-secondary" style="font-size:0.6em; padding:10px;" onclick="resetData()">RESETAR</button>
        </div>
      </div>
      
      <div class="editor-scroll-area">
        <div class="editor-content-wrapper">
          
          <div>
            <label>IMAGEM (URL)</label>
            <input type="text" id="inp-img" oninput="upd('img', this.value)" placeholder="https://...">
          </div>

          <div>
            <label>TÍTULO</label>
            <input type="text" id="inp-title" oninput="upd('title', this.value)" placeholder="Título do Post">
            <label style="margin-top:10px">SUBTÍTULO</label>
            <input type="text" id="inp-subtitle" oninput="upd('subtitle', this.value)" placeholder="Local / Data / Turno">
          </div>

          <div class="row">
            <div class="col"><label>HP</label><input type="text" id="inp-hp" oninput="upd('hp', this.value)" value="2000 / 4000"></div>
            <div class="col"><label>EA</label><input type="text" id="inp-ea" oninput="upd('ea', this.value)" value="3200 / 3200"></div>
          </div>

          <div>
            <label>NARRAÇÃO (RP)</label>
            <div class="text-area-wrapper">
              <div class="bbcode-toolbar">
                <button class="bb-btn" title="Negrito" onclick="insertTag('inp-content', '[b]', '[/b]')">B</button>
                <button class="bb-btn" title="Itálico" onclick="insertTag('inp-content', '[i]', '[/i]')">I</button>
                <button class="bb-btn" title="Sublinhado" onclick="insertTag('inp-content', '[u]', '[/u]')">U</button>
                <button class="bb-btn" title="Riscado" onclick="insertTag('inp-content', '[s]', '[/s]')">S</button>
                
                <div class="color-wrapper" title="Escolher Cor">
                   <div class="color-indicator" id="color-indicator-content" style="background:#fff"></div>
                   <input type="color" id="color-picker-content" onchange="updateColorIndicator('content', this.value)">
                </div>
                <button class="bb-btn apply-color" title="Aplicar Cor" onclick="applyColor('inp-content')">
                   <span class="material-icons-round" style="font-size:16px;">brush</span>
                </button>

                <button class="bb-btn" title="Spoiler" onclick="openModal('spoiler', 'inp-content')">
                   <span class="material-icons-round" style="font-size:16px;">visibility_off</span>
                </button>
                 <button class="bb-btn" title="Link" onclick="openModal('url', 'inp-content')">
                   <span class="material-icons-round" style="font-size:16px;">link</span>
                </button>
              </div>
              <textarea id="inp-content" oninput="upd('content', this.value)"></textarea>
            </div>
          </div>

          <div>
            <label>NOTAS DO SISTEMA</label>
            <div class="text-area-wrapper">
              <div class="bbcode-toolbar">
                <button class="bb-btn" onclick="insertTag('inp-extra', '[b]', '[/b]')">B</button>
                <button class="bb-btn" onclick="insertTag('inp-extra', '[i]', '[/i]')">I</button>
                <button class="bb-btn" onclick="insertTag('inp-extra', '[u]', '[/u]')">U</button>
                
                <div class="color-wrapper" title="Escolher Cor">
                   <div class="color-indicator" id="color-indicator-extra" style="background:#fff"></div>
                   <input type="color" id="color-picker-extra" onchange="updateColorIndicator('extra', this.value)">
                </div>
                <button class="bb-btn apply-color" title="Aplicar Cor" onclick="applyColor('inp-extra')">
                   <span class="material-icons-round" style="font-size:16px;">brush</span>
                </button>

                <button class="bb-btn" onclick="openModal('spoiler', 'inp-extra')">
                   <span class="material-icons-round" style="font-size:16px;">visibility_off</span>
                </button>
              </div>
              <textarea id="inp-extra" oninput="upd('extra', this.value)"></textarea>
            </div>
          </div>

          <div>
            <label>CÓDIGO FINAL</label>
            <textarea id="output-code" readonly style="font-family:monospace; color:var(--bit-green); border-color:var(--bit-green); height:80px;"></textarea>
            <button class="btn btn-success" style="margin-top:10px;" onclick="copyCode()">COPIAR CÓDIGO</button>
          </div>

        </div>
      </div>
    </div>

    <div class="preview-pane">
      <div id="preview-box"></div>
    </div>
  </div>

<script>
  let state = {
    img: "https://i.pinimg.com/736x/ed/54/c6/ed54c6dcaaa0bf1681a35652bea0c3f2.jpg",
    title: "Título da Postagem",
    subtitle: "Local / Data / Turno",
    hp: "2000 / 4000",
    ea: "3200 / 3200",
    content: "Escreva aqui a narração da sua personagem...",
    extra: ""
  };
  
  // Cores selecionadas
  let selectedColors = { content: '#ffffff', extra: '#ffffff' };
  let activeModalContext = { type: null, targetId: null };

  function upd(field, val) {
    state[field] = val;
    renderPreview();
    generateCode();
  }

  // --- COLOR PICKER LOGIC ---
  function updateColorIndicator(context, color) {
    selectedColors[context] = color;
    document.getElementById(`color-indicator-${context}`).style.backgroundColor = color;
  }

  function applyColor(textareaId) {
    const context = textareaId === 'inp-content' ? 'content' : 'extra';
    const color = selectedColors[context];
    insertTag(textareaId, `[color=${color}]`, '[/color]');
  }

  // --- MODAL LOGIC ---
  function openModal(type, targetId) {
    activeModalContext = { type, targetId };
    const modal = document.getElementById('generic-modal');
    const title = document.getElementById('modal-title');
    const input = document.getElementById('modal-input-field');
    
    if(type === 'spoiler') {
      title.textContent = "TÍTULO DO SPOILER";
      input.placeholder = "Ex: Inventário";
    } else {
      title.textContent = "URL DO LINK";
      input.placeholder = "https://...";
    }
    
    input.value = "";
    modal.style.display = 'flex';
    input.focus();
  }

  function closeModal() {
    document.getElementById('generic-modal').style.display = 'none';
  }

  // Confirmação do Modal
  document.getElementById('modal-confirm-btn').addEventListener('click', () => {
    const val = document.getElementById('modal-input-field').value.trim();
    const { type, targetId } = activeModalContext;
    
    if(type === 'spoiler') {
      const title = val || 'Spoiler';
      insertTag(targetId, `[spoiler="${title}"]`, '[/spoiler]');
    } else {
      const url = val || '#';
      insertTag(targetId, `[url=${url}]`, '[/url]');
    }
    closeModal();
  });

  // --- BBCODE HELPER ---
  function insertTag(textareaId, startTag, endTag) {
    const textarea = document.getElementById(textareaId);
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const text = textarea.value;
    
    const before = text.substring(0, start);
    const selected = text.substring(start, end);
    const after = text.substring(end);
    
    textarea.value = before + startTag + selected + endTag + after;
    textarea.selectionStart = start + startTag.length;
    textarea.selectionEnd = end + startTag.length;
    textarea.focus();
    
    if (textareaId === 'inp-content') upd('content', textarea.value);
    else upd('extra', textarea.value);
  }

  // --- BBCODE PARSER ---
  function parseBBCode(text) {
    if(!text) return '';
    let html = text
      .replace(/\n/g, '<br>')
      .replace(/\[b\](.*?)\[\/b\]/gs, '<b>$1</b>')
      .replace(/\[i\](.*?)\[\/i\]/gs, '<i>$1</i>')
      .replace(/\[u\](.*?)\[\/u\]/gs, '<u>$1</u>')
      .replace(/\[s\](.*?)\[\/s\]/gs, '<s>$1</s>')
      .replace(/\[color=(.*?)\](.*?)\[\/color\]/gs, '<span style="color:$1">$2</span>')
      .replace(/\[url=(.*?)\](.*?)\[\/url\]/gs, '<a href="$1" target="_blank" style="color:#a050ff">$2</a>')
      .replace(/\[spoiler="(.*?)"\](.*?)\[\/spoiler\]/gs, '<span class="spoiler-box" title="Clique para ver ($1)">$1 (Spoiler)</span>')
      .replace(/\[spoiler\](.*?)\[\/spoiler\]/gs, '<span class="spoiler-box" title="Spoiler">Spoiler</span>');
    return html;
  }

  function renderPreview() {
    const p = document.getElementById('preview-box');
    const contentHtml = parseBBCode(state.content);
    const extraHtml = parseBBCode(state.extra);

    const extraBlock = state.extra.trim() ? 
      `<div class="rp-post-extras"><div class="rp-post-extras-content">${extraHtml}</div></div>` : '';

    const html = `
      <div class="rp-post-container jjk-dossier-container">
        <div class="rp-post-image-wrapper">
          <img src="${state.img}" alt="Cena">
          <div class="overlay vignette-overlay"></div>
          <div class="overlay grid-overlay"></div>
          <div class="frame-corners"><span class="corner top-left"></span><span class="corner top-right"></span><span class="corner bottom-right"></span><span class="corner bottom-left"></span></div>
        </div>
        <div class="rp-post-header">
          <h2 class="post-title">${state.title}</h2>
          <p class="post-subtitle">${state.subtitle}</p>
        </div>
        <div class="jjk-dossier-status-bars">
          <div class="jjk-dossier-status-item"><span class="jjk-dossier-status-label">HP</span><div class="jjk-dossier-status-bar-wrapper"><div class="jjk-dossier-status-bar"><div class="jjk-dossier-status-bar-fill jjk-dossier-hp-fill" style="width:100%"></div></div><span class="jjk-dossier-status-value">${state.hp}</span></div></div>
          <div class="jjk-dossier-status-item"><span class="jjk-dossier-status-label">EA</span><div class="jjk-dossier-status-bar-wrapper"><div class="jjk-dossier-status-bar"><div class="jjk-dossier-status-bar-fill jjk-dossier-ea-fill" style="width:100%"></div></div><span class="jjk-dossier-status-value">${state.ea}</span></div></div>
        </div>
        <div class="rp-post-content">${contentHtml}</div>
        ${extraBlock}
      </div>
    `;
    p.innerHTML = html;
  }

  function generateCode() {
    const extraBlock = state.extra.trim() ? 
      `<div class="rp-post-extras"><div class="rp-post-extras-content">${state.extra.replace(/\n/g, '<br>')}</div></div>` : '';
      
    const fullHTML = `
<link href="https://gaaaaaaaaabs.github.io/goldenagerepositor.io/postagem2.css" rel="stylesheet" type="text/css">
<div class="rp-post-container jjk-dossier-container">
<div class="rp-post-image-wrapper"><img src="${state.img}"><div class="overlay vignette-overlay"></div><div class="overlay grid-overlay"></div><div class="frame-corners"><span class="corner top-left"></span><span class="corner top-right"></span><span class="corner bottom-right"></span><span class="corner bottom-left"></span></div></div>
<div class="rp-post-header"><h2 class="post-title">${state.title}</h2><p class="post-subtitle">${state.subtitle}</p></div>
<div class="jjk-dossier-status-bars">
<div class="jjk-dossier-status-item"><span class="jjk-dossier-status-label">HP</span><div class="jjk-dossier-status-bar-wrapper"><div class="jjk-dossier-status-bar"><div class="jjk-dossier-status-bar-fill jjk-dossier-hp-fill"></div></div><span class="jjk-dossier-status-value">${state.hp}</span></div></div>
<div class="jjk-dossier-status-item"><span class="jjk-dossier-status-label">EA</span><div class="jjk-dossier-status-bar-wrapper"><div class="jjk-dossier-status-bar"><div class="jjk-dossier-status-bar-fill jjk-dossier-ea-fill"></div></div><span class="jjk-dossier-status-value">${state.ea}</span></div></div>
</div>
<div class="rp-post-content">${state.content.replace(/\n/g, '<br>')}</div>
${extraBlock}
</div>`;

    const minified = fullHTML.replace(/(\r\n|\n|\r)/gm, " ").replace(/\s+/g, ' ').replace(/> </g, '><');
    document.getElementById('output-code').value = minified;
  }

  function copyCode() {
    document.getElementById('output-code').select();
    document.execCommand('copy');
    alert("Copiado!");
  }

  function populateInputs() {
    document.getElementById('inp-img').value = state.img;
    document.getElementById('inp-title').value = state.title;
    document.getElementById('inp-subtitle').value = state.subtitle;
    document.getElementById('inp-hp').value = state.hp;
    document.getElementById('inp-ea').value = state.ea;
    document.getElementById('inp-content').value = state.content;
    document.getElementById('inp-extra').value = state.extra;
  }

  function runImport() {
    const code = document.getElementById('import-area').value;
    if(!code) return alert("Cole o código.");
    const parser = new DOMParser();
    const doc = parser.parseFromString(code, 'text/html');

    state.img = doc.querySelector('.rp-post-image-wrapper img')?.src || '';
    state.title = doc.querySelector('.post-title')?.textContent || '';
    state.subtitle = doc.querySelector('.post-subtitle')?.textContent || '';
    state.hp = doc.querySelector('.jjk-dossier-status-item:nth-child(1) .jjk-dossier-status-value')?.textContent || '';
    state.ea = doc.querySelector('.jjk-dossier-status-item:nth-child(2) .jjk-dossier-status-value')?.textContent || '';
    
    const contentEl = doc.querySelector('.rp-post-content');
    state.content = contentEl ? contentEl.innerHTML.replace(/<br\s*\/?>/gi, '\n').trim() : '';
    
    const extraEl = doc.querySelector('.rp-post-extras-content');
    state.extra = extraEl ? extraEl.innerHTML.replace(/<br\s*\/?>/gi, '\n').trim() : '';

    populateInputs();
    renderPreview();
    generateCode();
    document.getElementById('import-modal').style.display = 'none';
  }

  function resetData() {
    if(confirm("Limpar tudo?")) location.reload();
  }

  populateInputs();
  renderPreview();
  generateCode();
</script>
</body>
</html>
